<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>攝影機 + QR掃描</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f5f5f5;
}

#reader{
  width:90%;
  max-width:500px;
  margin:auto;
}

button{
  padding:10px 20px;
  margin:10px;
  font-size:16px;
}

#result{
  margin-top:20px;
  font-size:18px;
  color:blue;
}
</style>
</head>

<body>

<h2>攝影機 + QR Code 掃描</h2>

<div id="reader"></div>

<br>

<button onclick="startCamera()">開啟攝影機</button>
<button onclick="stopCamera()">關閉攝影機</button>

<div id="result">掃描結果會顯示在這裡</div>

<script>

let scanner;
let isRunning = false;

function startCamera(){

  if(isRunning) return;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (text) => {

      document.getElementById("result").innerText =
        "掃描結果：" + text;

    }
  );

  isRunning = true;
}

function stopCamera(){

  if(scanner && isRunning){

    scanner.stop().then(()=>{
      isRunning = false;
    });

  }

}

</script>

</body>
</html>
